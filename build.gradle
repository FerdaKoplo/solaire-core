plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.teavm' version '0.15.0'
}

group = 'dev.jreact'
version = '1.0.0'

base {
    archivesName = 'solaire-core'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'solaire-core'
            from components.java
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.teavm:teavm-jso-apis:0.15.0' 
    }

