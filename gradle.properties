# Gradle project properties for publishing.
#
# Do NOT put secret values here. In CI, .github/workflows/publish.yml
# passes them as ORG_GRADLE_PROJECT_* environment variables (mapped to
# Gradle project properties) from repository secrets. Leave these blank
# locally; publish only from CI.
#
# Environment variables the workflow sets from repo secrets:
#   ORG_GRADLE_PROJECT_mavenCentralUsername      = Central Portal user token
#   ORG_GRADLE_PROJECT_mavenCentralPassword      = Central Portal token password
#   ORG_GRADLE_PROJECT_signingInMemoryKey         = ASCII-armored private PGP key,
#                                                  full BEGIN/END block WITH newlines
#   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword = PGP key passphrase
#
# To generate a Central Portal user token:
#   central.sonatype.com -> Account -> "View Account" -> "Generate User Token"
#
# To export the in-memory signing key (prints the PRIVATE key — keep it secret):
#   gpg --batch --pinentry-mode loopback --passphrase '<passphrase>' \
#       --armor --export-secret-keys <KEY-ID>
#   Paste the ENTIRE block (BEGIN line, all lines, END line) into the secret.
#
# Publish the public key so Central can validate signatures:
#   gpg --armor --export <KEY-ID>  -> upload at keys.openpgp.org
#
# POM metadata name/description/url/license/developer is set in build.gradle
# (single source — do not duplicate with POM_* properties here).
