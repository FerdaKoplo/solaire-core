# Maven Central (Central Portal) publishing credentials.
#
# These are NOT committed values. In CI, .github/workflows/publish.yml
# appends real values from repository secrets before running the publish
# task. Locally, leave them commented out and publish only from CI.
#
# Generate a Central Portal user token at central.sonatype.com:
#   Account -> "View Account" -> "Generate User Token"
#   username = token user value, password = token password value
# mavenCentralUsername=
# mavenCentralPassword=
#
# PGP signing key (Central requires .asc signatures on every artifact).
#   gpg --armor --gen-key  then:
#   gpg --armor --export-secret-keys <key-id>  (copy the block below,
#   newlines written as \n, into signingInMemoryKey)
# signingInMemoryKey=
# signingInMemoryKeyPassword=

# POM metadata Central requires.
POM_NAME=solaire-core
POM_DESCRIPTION=A small React-shaped UI core for TeaVM.
POM_URL=https://github.com/FerdaKoplo/solaire-core
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_DEVELOPER_ID=FerdaKoplo
POM_DEVELOPER_NAME=FerdaKoplo