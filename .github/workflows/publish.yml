name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to Central Portal and release (false = upload only, manual publish in the portal)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - name: Test
        run: ./gradlew test --console=plain
      - name: Compile (cache warm)
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        run: ./gradlew compileJava compileTestJava

  publish:
    name: publish
    needs: gate
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - name: Write Central Portal credentials
        run: |
          {
            echo "mavenCentralUsername=${{ secrets.CENTRAL_USERNAME }}"
            echo "mavenCentralPassword=${{ secrets.CENTRAL_PASSWORD }}"
          } >> gradle.properties
      - name: Write in-memory signing key
        if: secrets.CENTRAL_SIGNING_KEY != ''
        run: |
          printf 'signingInMemoryKey=%s\n' "${{ secrets.CENTRAL_SIGNING_KEY }}" >> gradle.properties
          printf 'signingInMemoryKeyPassword=%s\n' "${{ secrets.CENTRAL_SIGNING_KEY_PASSWORD }}" >> gradle.properties
      - name: Publish
        run: |
          if [ "${{ github.event.inputs.publish }}" = "false" ]; then
            ./gradlew publishToMavenCentral --console=plain
          else
            ./gradlew publishAndReleaseToMavenCentral --console=plain
          fi