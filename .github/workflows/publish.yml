name: publish

on:
  release:
    types: [published]
  push:
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to Central Portal and release (false = upload only, manual publish in the portal)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - name: Test
        run: ./gradlew test --console=plain
      - name: Compile (cache warm)
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        run: ./gradlew compileJava compileTestJava

  publish:
    name: publish
    needs: gate
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      # Secrets never touch gradle.properties. Gradle maps ORG_GRADLE_PROJECT_*
      # env vars to project properties, which is what the plugin reads.
      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.CENTRAL_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.CENTRAL_SIGNING_KEY_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.publish }}" = "false" ]; then
            ./gradlew publishToMavenCentral --console=plain --no-daemon
          else
            ./gradlew publishAndReleaseToMavenCentral --console=plain --no-daemon
          fi
